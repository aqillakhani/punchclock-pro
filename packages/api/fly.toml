# Fly.io configuration for the PunchClock Pro API.
#
# Deploy from the MONOREPO ROOT (the Docker build context must include the
# workspace lockfile + the shared package):
#
#   flyctl deploy . --remote-only \
#     --config packages/api/fly.toml \
#     --dockerfile packages/api/Dockerfile
#
# Required secrets (set once with `flyctl secrets set ... --config packages/api/fly.toml`):
#   DATABASE_URL            postgres://punchclock_app:<pw>@punchclock-db.internal:5432/punchclock
#                           Self-hosted Postgres 16 + TimescaleDB + PostGIS on Fly
#                           (app `punchclock-db`, image in deploy/db/) — NOT Neon,
#                           which cannot host the timescaledb extension the schema
#                           needs. Connect as `punchclock_app`, never the bootstrap
#                           superuser: RLS is the tenant boundary and a superuser
#                           silently skips every policy.
#                           Put NO `sslmode` in this URL — recent `pg` reads
#                           sslmode=require as verify-full and rejects the
#                           self-signed cert. TLS comes from DATABASE_SSL below.
#   JWT_SECRET              64 random bytes (openssl rand -base64 64)
#   CORS_ALLOWED_ORIGINS    https://<your web domain>  (no localhost in prod)
#   WEB_APP_URL             https://<your web domain>  (used in email links)
#   RESEND_API_KEY          if EMAIL_PROVIDER=resend
#   SENTRY_DSN              optional, enables error tracking
#   S3_ENDPOINT / S3_BUCKET / S3_ACCESS_KEY_ID / S3_SECRET_ACCESS_KEY  for documents
#
# Optional secrets:
#   REDIS_URL               redis:// or rediss:// URL. Only needed once
#                           `min_machines_running` / `fly scale count` puts more
#                           than one machine in service: Socket.io broadcasts
#                           must then fan out across instances via Redis pub/sub.
#                           Leave it unset for a single machine — /health reports
#                           redis "disabled" and stays "ok". A localhost value is
#                           rejected at boot in production.
#
# APP_VERSION is injected at deploy time: `--build-arg`/secret or `flyctl deploy --env APP_VERSION=$(git rev-parse --short HEAD)`.

app = "punchclock-api"
primary_region = "ord"

# Periodic sweeps (auto clock-out, audit-log pruning) run inside the API
# process on a timer — see packages/api/src/jobs/. They are deliberately NOT a
# separate scheduled machine: an out-of-band `fly machine run` is invisible in
# the repo and gets lost when the app is recreated, which is how audit-log
# pruning stayed documented-but-never-running. A Postgres advisory lock keeps
# them correct if `fly scale count` ever puts more than one machine in service.
# Override cadence with AUTO_CLOCK_OUT_INTERVAL_MINUTES /
# AUDIT_LOG_PRUNE_INTERVAL_MINUTES, or set SCHEDULED_JOBS_ENABLED=false to
# drive the equivalent CLIs from somewhere else.
[env]
  NODE_ENV = "production"
  API_PORT = "8080"
  DATABASE_SSL = "true"
  EMAIL_PROVIDER = "resend"
  SCHEDULED_JOBS_ENABLED = "true"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "suspend"
  auto_start_machines = true
  # Keep one machine warm — the API holds long-lived Socket.io connections,
  # AND the scheduled sweeps above are Node timers inside this process. A
  # suspended machine runs no timers, so this line is load-bearing for them.
  # Fly stops/suspends machines only down to this floor, never below it, so
  # one machine stays fully running in the primary region even with no
  # traffic: https://fly.io/docs/launch/autostop-autostart/
  # Note the floor is per primary region — adding a second region would not
  # extend the guarantee to it.
  min_machines_running = 1

  [http_service.concurrency]
    type = "requests"
    soft_limit = 200
    hard_limit = 250

# Liveness: 200 as long as the process is up. Readiness (/health/ready) and the
# full report (/health) are used by external uptime monitoring, not by Fly.
[[http_service.checks]]
  grace_period = "10s"
  interval = "15s"
  method = "GET"
  path = "/health/live"
  timeout = "5s"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory = "512mb"
